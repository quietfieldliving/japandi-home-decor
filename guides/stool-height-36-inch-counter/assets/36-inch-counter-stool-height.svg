<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">A 36-inch counter and a 24-inch stool: measure top height and underside clearance separately</title>
<desc id="desc">Illustrative side view. Countertop is 36 inches above the floor; its underside is 34.5 inches in this example. A 24-inch seat leaves a 12-inch top-height difference and 10.5 inches of actual underside clearance. The countertop thickness is an example, not a standard.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#8a6b3f" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="675" fill="#f7f6f4"/>
<g font-family="Arial,sans-serif" fill="#1c1c1c"><text x="58" y="64" font-size="31">36-inch counter: check the usable gap</text><text x="58" y="99" font-size="20" fill="#6b6b6b">Side-view example • not a product drawing</text></g>
<path d="M60 570H1140" stroke="#b8b2a8" stroke-width="3"/>
<rect x="215" y="210" width="530" height="15" rx="3" fill="#d8c7ad" stroke="#8a6b3f" stroke-width="2"/>
<rect x="215" y="225" width="210" height="345" fill="#e6e4e0"/>
<rect x="545" y="330" width="170" height="18" rx="9" fill="#d8c7ad" stroke="#8a6b3f" stroke-width="2"/>
<path d="M565 348L550 570M690 348L710 570M555 485H701" fill="none" stroke="#8a6b3f" stroke-width="9"/>
<g fill="none" stroke="#8a6b3f" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"><path d="M150 216V564"/><path d="M785 336V564"/><path d="M885 231V324"/></g>
<g stroke="#b8b2a8" stroke-width="1.5" stroke-dasharray="6 6"><path d="M745 225H915"/><path d="M715 330H915"/></g>
<g font-family="Arial,sans-serif" fill="#1c1c1c" font-size="25"><text x="88" y="408" transform="rotate(-90 88 408)">36 in to countertop</text><text x="820" y="485" transform="rotate(-90 820 485)">24 in to seat</text><text x="925" y="272">10.5 in</text><text x="925" y="305" font-size="20">underside gap</text><text x="475" y="185" font-size="22">34.5 in underside in this example</text><text x="58" y="621" font-size="21">36 − 24 = 12 in top-height difference • 34.5 − 24 = 10.5 in usable gap</text></g>
</svg>
