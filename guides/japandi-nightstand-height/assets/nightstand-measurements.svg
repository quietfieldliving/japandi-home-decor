<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f7f6f4"/><text x="70" y="80" style="font-family:Georgia;font-size:46px" fill="#29251f">How tall should a nightstand be?</text><text x="70" y="128" style="font-family:Arial;font-size:24px" fill="#65513c">Measure your mattress top. Check the space beside your bed.</text><g transform="translate(100,185)"><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#65513c"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#29251f;font-size:17px}.dim{stroke:#65513c;stroke-width:2;marker-start:url(#arrow);marker-end:url(#arrow)}</style><rect width="440" height="390" fill="#f7f6f4"/><text x="24" y="32" font-size="20" font-weight="bold">1. Compare top surfaces</text><path d="M24 330H416" stroke="#948b7d" stroke-width="2"/><rect x="44" y="174" width="212" height="61" rx="9" fill="#e5dbcc" stroke="#b5a994"/><rect x="44" y="235" width="212" height="47" fill="#c5ac87"/><path d="M58 282V330M240 282V330" stroke="#6b5944" stroke-width="8"/><rect x="292" y="203" width="106" height="68" rx="3" fill="#c5ac87" stroke="#6b5944"/><path d="M303 271V330M387 271V330" stroke="#6b5944" stroke-width="6"/><path d="M30 182V323M276 211V323" class="dim"/><text x="40" y="148">Mattress top (H)</text><text x="283" y="178">Table top (N)</text><text x="8" y="263">H</text><text x="258" y="276">N</text><text x="24" y="366">Measure from the same floor level.</text></g><g transform="translate(660,185)"><defs><marker id="arrow2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#65513c"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#29251f;font-size:17px}.dim{stroke:#65513c;stroke-width:2;marker-start:url(#arrow2);marker-end:url(#arrow2)}</style><rect width="440" height="390" fill="#f7f6f4"/><text x="24" y="32" font-size="20" font-weight="bold">2. Check the full footprint</text><text x="24" y="65">Top view · not to scale</text><rect x="26" y="139" width="140" height="185" rx="6" fill="#e5dbcc" stroke="#b5a994"/><text x="65" y="235">Bed</text><rect x="212" y="155" width="135" height="126" rx="3" fill="#c5ac87" stroke="#6b5944"/><text x="235" y="213">Table</text><text x="233" y="238">body</text><path d="M400 110V330" stroke="#948b7d" stroke-width="8"/><path d="M172 104H393" class="dim"/><text x="198" y="91">Side space (S)</text><path d="M174 306H205M354 306H392" class="dim"/><text x="177" y="338" font-size="15">Gap</text><text x="355" y="338" font-size="15">Gap</text><text x="24" y="374">Width allowance = S − both gaps</text></g><text x="70" y="635" style="font-family:Arial;font-size:22px" fill="#65513c">Quiet Field Living · A measurement guide, not a product fit guarantee</text></svg>