<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pin 04 — Minimal Japanese Lighting Ideas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="pin-styles.css">
</head>
<body>
  <div class="pin">

    <p class="eyebrow">Interior Ideas</p>

    <h1 class="title title-sm">Minimal Japanese<br>Lighting Ideas</h1>

    <div class="rule"></div>

    <p class="subtitle">Create a Calm and Cozy Room</p>

    <!-- 静かな和のリビング（すべてCSSで描いています） -->
    <div class="room">

      <!-- 左：和紙ランプ -->
      <div class="lamp">
        <div class="shade"></div>
        <div class="stem"></div>
        <div class="base"></div>
      </div>

      <!-- 中央：ローテーブルと花瓶 -->
      <div class="low-table">
        <div class="top"></div>
        <div class="legs"></div>
      </div>
      <div class="vase"></div>

      <!-- 右：植物 -->
      <div class="plant">
        <span class="leaf"></span>
        <span class="leaf"></span>
        <span class="leaf"></span>
        <div class="pot"></div>
      </div>

      <div class="floor"></div>
    </div>

    <div class="footer">
      <p class="footer-label">Shoji Floor Lamp Guide</p>
      <p class="site-name">Quiet Field Living</p>
    </div>

  </div>
</body>
</html>
